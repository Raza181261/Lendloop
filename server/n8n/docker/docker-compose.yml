services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: lendloop-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678" # only your own machine can open the UI
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - WEBHOOK_URL=${WEBHOOK_URL}
      # Lets workflow expressions read $env.* (values come from .env, not the JSON)
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - LENDLOOP_HMAC_SECRET=${LENDLOOP_HMAC_SECRET}
      - CONVEX_SITE_URL=${CONVEX_SITE_URL}
      # Keep the execution history small
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data: